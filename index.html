<title>Ekonomi</title>
<style>
:root{
  --paper:#EEF0EC; --card:#FFFFFF; --ink:#12191B; --muted:#6A7A7B; --line:#DDE2DD;
  --petrol:#12655A; --slate:#4A6572; --clay:#A8452F; --sand:#B5811F; --plum:#6B4A6E;
  --lake:#3D7EA6; --stone:#8A9490; --good:#12655A; --bad:#A8452F;
  --r:16px; --pad:16px;
}
@media (prefers-color-scheme: dark){
  :root{
    --paper:#0E1413; --card:#171F1E; --ink:#E9EEEA; --muted:#8E9C99; --line:#25322F;
    --petrol:#43A992; --slate:#7C99A8; --clay:#D9705A; --sand:#D3A24A; --plum:#A57FA8;
    --lake:#6FAAD0; --stone:#9AA5A1; --good:#43A992; --bad:#D9705A;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--paper); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  font-size:16px; line-height:1.45;
  padding-bottom:calc(78px + env(safe-area-inset-bottom));
  -webkit-text-size-adjust:100%;
}
.num{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.serif{font-family:ui-serif,"New York",Georgia,serif}

/* header */
header{
  position:sticky;top:0;z-index:20;background:var(--paper);
  padding:calc(env(safe-area-inset-top) + 10px) var(--pad) 10px;
  border-bottom:1px solid var(--line);
}
.monthbar{display:flex;align-items:center;justify-content:space-between;gap:8px}
.monthbar h1{margin:0;font-size:19px;font-weight:600;letter-spacing:-.01em;text-transform:capitalize}
.monthbar button{
  border:1px solid var(--line);background:var(--card);color:var(--ink);
  width:38px;height:38px;border-radius:12px;font-size:17px;line-height:1;cursor:pointer
}
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}

main{padding:14px var(--pad) 24px;max-width:640px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px}
.card h2{margin:0 0 12px;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}

/* signature: flödesbalken */
.hero{padding-bottom:18px}
.hero .amount{font-size:40px;line-height:1;font-weight:600;letter-spacing:-.03em;margin:2px 0 2px}
.hero .sub{color:var(--muted);font-size:14px}
.flow{display:flex;height:14px;border-radius:7px;overflow:hidden;margin:18px 0 12px;background:var(--line)}
.flow span{display:block;height:100%}
.legend{display:flex;flex-direction:column;gap:9px}
.legend .row{display:flex;align-items:center;gap:10px;font-size:15px}
.dot{width:10px;height:10px;border-radius:3px;flex:none}
.legend .row .lbl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.legend .row .val{font-weight:600}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.stat .k{font-size:12px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;font-weight:600}
.stat .v{font-size:22px;font-weight:600;letter-spacing:-.02em;margin-top:4px}
.pos{color:var(--good)} .neg{color:var(--bad)}

.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden;margin:8px 0}
.bar > i{display:block;height:100%;background:var(--petrol)}

ul.list{list-style:none;margin:0;padding:0}
ul.list li{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
ul.list li:last-child{border-bottom:0}
ul.list .who{flex:1;min-width:0}
ul.list .who b{display:block;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
ul.list .who small{color:var(--muted);font-size:12px}
ul.list .kr{font-weight:600;white-space:nowrap}
.x{border:0;background:none;color:var(--muted);font-size:20px;padding:0 2px;cursor:pointer;line-height:1}

input,select,button,textarea{font-family:inherit;font-size:16px}
input[type=text],input[type=number],input[type=date],select{
  width:100%;padding:12px 13px;border:1px solid var(--line);border-radius:12px;
  background:var(--paper);color:var(--ink);appearance:none
}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--petrol);outline-offset:1px}
label{display:block;font-size:12px;color:var(--muted);margin:0 0 5px;letter-spacing:.06em;text-transform:uppercase;font-weight:600}
.field{margin-bottom:10px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{
  width:100%;padding:14px;border-radius:12px;border:0;background:var(--petrol);color:#fff;
  font-weight:600;cursor:pointer;letter-spacing:.01em
}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn.sm{padding:10px;font-size:14px}
.hint{font-size:13px;color:var(--muted);margin:8px 0 0}
.chip{
  border:1px solid var(--line);background:var(--paper);color:var(--muted);
  border-radius:999px;padding:5px 11px;font-size:13px;font-weight:600;cursor:pointer
}
.catsel{border:0;background:none;width:auto;padding:4px 0;font-size:12px;color:var(--muted);font-weight:600}
.empty{color:var(--muted);font-size:14px;padding:6px 0}

/* tabbar */
nav{
  position:fixed;left:0;right:0;bottom:0;z-index:30;
  background:var(--card);
  background:color-mix(in srgb,var(--card) 92%, transparent);
  backdrop-filter:saturate(180%) blur(14px);-webkit-backdrop-filter:saturate(180%) blur(14px);
  border-top:1px solid var(--line);
  display:flex;padding:6px 4px calc(6px + env(safe-area-inset-bottom));
}
nav button{
  flex:1;background:none;border:0;color:var(--muted);font-size:11px;font-weight:600;
  padding:6px 2px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;
  letter-spacing:.02em;border-radius:10px
}
nav button .ic{font-size:17px;line-height:1}
nav button[aria-current=page]{color:var(--petrol)}
#toast{
  position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom));
  background:var(--ink);color:var(--paper);padding:11px 16px;border-radius:12px;font-size:14px;
  z-index:50;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90%;text-align:center
}
#toast.on{opacity:1}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip.on{background:var(--petrol);border-color:var(--petrol);color:#fff}
.chip.q{font-weight:500;text-align:left}
details.blk{border-bottom:1px solid var(--line)}
details.blk:last-of-type{border-bottom:0}
details.blk summary{display:flex;align-items:center;gap:10px;padding:13px 0;cursor:pointer;list-style:none}
details.blk summary::-webkit-details-marker{display:none}
details.blk summary .lbl{flex:1;min-width:0;font-weight:500}
details.blk summary .lbl small{display:block;color:var(--muted);font-size:12px;font-weight:400}
details.blk[open] summary .lbl{color:var(--petrol)}
.blkbody{padding:2px 0 16px;font-size:14.5px;color:var(--ink)}
.blkbody p{margin:0 0 10px}
.blkbody b{font-weight:600}
.blkbody .plus b{color:var(--good)} .blkbody .minus b{color:var(--bad)}
ul.kv{list-style:none;margin:10px 0;padding:0}
ul.kv li{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px}
ul.kv li:last-child{border-bottom:0}
ul.kv li span{color:var(--muted)}
ul.status{list-style:none;margin:0;padding:0}
ul.status li{display:flex;gap:11px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
ul.status li:last-child{border-bottom:0}
ul.status .pip{width:9px;height:9px;border-radius:50%;margin-top:6px;flex:none}
ul.status .ok .pip,ul.status li.ok .pip{background:var(--good)}
ul.status li.mid .pip{background:var(--sand)}
ul.status li.bad .pip{background:var(--bad)}
ul.status .who b{display:block;font-weight:600;font-size:15px}
ul.status .who small{color:var(--muted);font-size:13px}
.answer{margin-top:14px;padding-top:14px;border-top:1px solid var(--line);font-size:14.5px}
.answer p{margin:0 0 10px}
textarea{width:100%;padding:12px 13px;border:1px solid var(--line);border-radius:12px;background:var(--paper);color:var(--ink);resize:vertical;font-size:16px}
.chat{display:flex;flex-direction:column;gap:10px}
.msg{max-width:92%;padding:11px 13px;border-radius:14px;font-size:14.5px}
.msg p{margin:0}
.msg.user{align-self:flex-end;background:var(--petrol);color:#fff;border-bottom-right-radius:5px}
.msg.assistant{align-self:flex-start;background:var(--paper);border:1px solid var(--line);border-bottom-left-radius:5px}
.msg.thinking{color:var(--muted);font-style:italic}
.msg.err{align-self:stretch;background:transparent;border:1px solid var(--bad);color:var(--bad)}
.sync{font-size:13px;color:var(--muted);font-weight:600}
.sync.ok{color:var(--good)} .sync.bad{color:var(--bad)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<header>
  <div class="monthbar">
    <button id="prevM" aria-label="Föregående månad">‹</button>
    <div style="text-align:center">
      <div class="eyebrow" id="tabName">Översikt</div>
      <h1 id="monthLabel">augusti 2026</h1>
    </div>
    <button id="nextM" aria-label="Nästa månad">›</button>
  </div>
</header>

<main id="view"></main>

<nav>
  <button data-tab="hem" aria-current="page"><span class="ic">◎</span>Hem</button>
  <button data-tab="utgifter"><span class="ic">＋</span>Utgifter</button>
  <button data-tab="fasta"><span class="ic">≡</span>Fasta</button>
  <button data-tab="spara"><span class="ic">◆</span>Sparande</button>
  <button data-tab="invest"><span class="ic">▲</span>Invest</button>
  <button data-tab="coach"><span class="ic">✦</span>Coach</button>
</nav>

<div id="toast"></div>

<script>
"use strict";
/* ---------- data ---------- */
var KEY="ekonomi.v1";
var CATS=["Mat","Boende","Transport","Abonnemang","Shopping","Nöjen","Övrigt"];
var CATCOLOR={Mat:"var(--petrol)",Boende:"var(--slate)",Transport:"var(--sand)",
  Abonnemang:"var(--plum)",Shopping:"var(--clay)","Nöjen":"var(--lake)","Övrigt":"var(--stone)"};
var KEYWORDS={
  Mat:["ica","coop","willys","hemköp","lidl","citygross","city gross","matbutik","restaurang","mcdonalds","max","burger","sushi","lunch","fika","café","cafe","espresso house","pressbyrån","seven","foodora","uber eats","wolt","pizza","kebab","bageri"],
  Boende:["hyra","el ","elräkning","bolån","amortering","hemförsäkring","bredband","vatten","sopor","fjärrvärme","avgift","brf","hemma"],
  Transport:["sl","bensin","diesel","tanka","circle k","preem","ok q8","st1","ingo","parkering","p-avgift","trängsel","tull","buss","tåg","sj","pendel","taxi","uber","bilverkstad","däck","besiktning","bilförsäkring"],
  Abonnemang:["spotify","netflix","hbo","max ","disney","viaplay","prime","telia","tele2","comviq","telenor","tre","halebop","mobil","icloud","gym","sats","fitness24","nordic wellness","prenumeration","abonnemang","storytel","youtube"],
  Shopping:["h&m","hm ","zara","elgiganten","webhallen","amazon","clas ohlson","ikea","jula","biltema","kläder","skor","zalando","kjell","apple","boozt","xxl"],
  "Nöjen":["bio","filmstaden","systembolaget","systemet","pub","bar","krogen","konsert","spel","steam","playstation","padel","biljett","nöje","utekväll","resa","hotell"]
};
var INVTYPES=["Aktier","Fonder","ETF","Räntor","Krypto","Övrigt"];

var DEFAULT={income:[],fixed:[],expenses:[],investments:[],settingsAt:0,
  settings:{monthlyGoal:0,totalGoal:0,startSavings:0,riskProfile:"Balanserad",horizonYears:10,cashOverride:0,targetDate:"",aiModel:"claude-sonnet-5"}};

function load(){
  try{
    var raw=localStorage.getItem(KEY);
    if(!raw) return JSON.parse(JSON.stringify(DEFAULT));
    var d=JSON.parse(raw);
    for(var k in DEFAULT){ if(!(k in d)) d[k]=JSON.parse(JSON.stringify(DEFAULT[k])); }
    for(var s in DEFAULT.settings){ if(d.settings[s]===undefined) d.settings[s]=DEFAULT.settings[s]; }
    return d;
  }catch(e){ return JSON.parse(JSON.stringify(DEFAULT)); }
}
var db=load();
function save(){
  if(typeof stampChanges==="function") stampChanges();
  try{ localStorage.setItem(KEY,JSON.stringify(db)); }
  catch(e){ toast("Kunde inte spara. Frigör utrymme i Safari."); }
  if(typeof scheduleSync==="function") scheduleSync();
}
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }

/* ---------- hjälp ---------- */
function kr(n){ return Math.round(n).toLocaleString("sv-SE")+" kr"; }
function pct(n){ return (Math.round(n*10)/10).toLocaleString("sv-SE")+" %"; }
function todayISO(){ var d=new Date(); return d.getFullYear()+"-"+p2(d.getMonth()+1)+"-"+p2(d.getDate()); }
function p2(n){ return (n<10?"0":"")+n; }
function mKey(d){ return d.slice(0,7); }
function monthName(key){
  var p=key.split("-"); var d=new Date(+p[0],+p[1]-1,1);
  return d.toLocaleDateString("sv-SE",{month:"long",year:"numeric"});
}
function shiftMonth(key,delta){
  var p=key.split("-"); var d=new Date(+p[0],+p[1]-1+delta,1);
  return d.getFullYear()+"-"+p2(d.getMonth()+1);
}
function esc(s){ return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];}); }
function toast(msg){
  var t=document.getElementById("toast"); t.textContent=msg; t.classList.add("on");
  clearTimeout(toast._t); toast._t=setTimeout(function(){ t.classList.remove("on"); },2200);
}
function num(v){ var n=parseFloat(String(v).replace(/\s/g,"").replace(",",".")); return isFinite(n)?n:0; }

/* ---------- beräkningar ---------- */
var view=mKey(todayISO());
function sumIncome(){ return L("income").reduce(function(a,b){return a+b.amount;},0); }
function sumFixed(){ return L("fixed").reduce(function(a,b){return a+b.amount;},0); }
function expOf(m){ return L("expenses").filter(function(e){return mKey(e.date)===m;}); }
function sumVar(m){ return expOf(m).reduce(function(a,b){return a+b.amount;},0); }
function savedOf(m){ return sumIncome()-sumFixed()-sumVar(m); }
function investedIn(m){
  var s=0;
  L("investments").forEach(function(i){
    (i.contribs||[]).forEach(function(c){ if(mKey(c.date)===m) s+=c.amount; });
  });
  return s;
}
function activeMonths(){
  var set={}; L("expenses").forEach(function(e){ set[mKey(e.date)]=1; });
  var arr=Object.keys(set); arr.sort(); return arr;
}
function totalSaved(){
  return db.settings.startSavings + activeMonths().reduce(function(a,m){return a+savedOf(m);},0);
}
function avgSaved(){
  var ms=activeMonths().slice(-3);
  if(!ms.length) return savedOf(view);
  return ms.reduce(function(a,m){return a+savedOf(m);},0)/ms.length;
}
function invTotals(){
  var inv=0,val=0;
  L("investments").forEach(function(i){ inv+=i.invested; val+=i.value; });
  return {invested:inv,value:val,pl:val-inv,ret:inv>0?((val-inv)/inv*100):0};
}

/* ---------- parser: "ICA – 650 kr – Mat" ---------- */
function parseExpense(text){
  var t=text.trim(); if(!t) return null;
  var cat=null;
  // uttalad kategori sist eller var som helst
  CATS.forEach(function(c){
    var re=new RegExp("(^|[\\s,;\\-–—])"+c+"([\\s,;\\-–—]|$)","i");
    if(!cat && re.test(t)){ cat=c; t=t.replace(re," "); }
  });
  var m=t.match(/-?\d[\d\s]*([.,]\d{1,2})?/);
  if(!m) return null;
  var amount=num(m[0]);
  if(!amount) return null;
  var name=(t.slice(0,m.index)+" "+t.slice(m.index+m[0].length))
    .replace(/\bkr\b|\bsek\b|:-/gi," ")
    .replace(/[\-–—,;]+/g," ").replace(/\s+/g," ").trim();
  if(!cat){
    var low=(name+" ").toLowerCase();
    for(var c2 in KEYWORDS){
      for(var i=0;i<KEYWORDS[c2].length;i++){
        if(low.indexOf(KEYWORDS[c2][i])>-1){ cat=c2; break; }
      }
      if(cat) break;
    }
  }
  if(!name) name="Utgift";
  name=name.charAt(0).toUpperCase()+name.slice(1);
  return {name:name,amount:Math.abs(amount),cat:cat||"Övrigt"};
}

/* ---------- vyer ---------- */
var tab="hem";
var TABNAMES={hem:"Översikt",utgifter:"Rörliga utgifter",fasta:"Inkomst & fasta",spara:"Sparande",invest:"Investeringar",coach:"AI-coach"};

function render(){
  document.getElementById("monthLabel").textContent=monthName(view);
  document.getElementById("tabName").textContent=TABNAMES[tab];
  var el=document.getElementById("view");
  el.innerHTML=({hem:viewHem,utgifter:viewUtgifter,fasta:viewFasta,spara:viewSpara,invest:viewInvest,coach:viewCoach})[tab]();
  wire();
  window.scrollTo(0,0);
}

function viewHem(){
  var inc=sumIncome(), fix=sumFixed(), vr=sumVar(view), sav=inc-fix-vr;
  var rate=inc>0?(sav/inc*100):0;
  var invM=investedIn(view), it=invTotals();
  var kvar=inc-fix-vr-(db.settings.monthlyGoal||0);
  var base=Math.max(inc, fix+vr+Math.max(sav,0), 1);
  var h="";

  if(inc===0 && vr===0 && fix===0){
    h+='<div class="card"><h2>Kom igång</h2>'+
      '<p style="margin:0 0 12px">Lägg in din inkomst och dina fasta utgifter en gång — sedan räknar appen resten åt dig varje månad.</p>'+
      '<button class="btn" data-go="fasta">Lägg in inkomst</button></div>';
  }

  h+='<div class="card hero">'+
    '<div class="eyebrow">Kvar att spara denna månad</div>'+
    '<div class="amount num serif '+(sav<0?"neg":"")+'">'+kr(sav)+'</div>'+
    '<div class="sub">'+pct(rate)+' av '+kr(inc)+'</div>'+
    '<div class="flow">'+
      '<span style="background:var(--slate);width:'+(fix/base*100)+'%"></span>'+
      '<span style="background:var(--clay);width:'+(vr/base*100)+'%"></span>'+
      '<span style="background:var(--petrol);width:'+(Math.max(sav,0)/base*100)+'%"></span>'+
    '</div>'+
    '<div class="legend">'+
      legendRow("var(--slate)","Fasta utgifter",fix)+
      legendRow("var(--clay)","Rörliga utgifter",vr)+
      legendRow("var(--petrol)","Sparat",sav)+
    '</div></div>';

  h+='<div class="grid">'+
    stat("Inkomst",kr(inc))+
    stat("Utgifter",kr(fix+vr))+
    stat("Spargrad",pct(rate),rate>=0?"pos":"neg")+
    stat("Investerat i mån.",kr(invM))+
    stat("Kvar att använda",kr(kvar),kvar>=0?"":"neg")+
    stat("Sparat totalt",kr(totalSaved()))+
    '</div>';

  // kategorier
  var byCat={},list=expOf(view);

var SYNCKEY="ekonomi.sync";
var snap={}, syncState={t:0,err:null,busy:false}, syncTimer=null;
function syncCfg(){ try{ return JSON.parse(localStorage.getItem(SYNCKEY)||"null"); }catch(e){ return null; } }
function setSyncCfg(c){ try{ localStorage.setItem(SYNCKEY,JSON.stringify(c)); }catch(e){} }
function meName(){ var c=syncCfg(); return (c&&c.me)?c.me:""; }
function L(k){ return (db[k]||[]).filter(function(x){ return !x.del; }); }
function itemKey(o){
  var c={}; Object.keys(o).forEach(function(k){ if(k!=="at") c[k]=o[k]; });
  return JSON.stringify(c);
}
function rebuildSnap(){
  snap={};
  ["income","fixed","expenses","investments"].forEach(function(k){
    (db[k]||[]).forEach(function(i){ snap[k+":"+i.id]=itemKey(i); });
  });
  snap.__settings=JSON.stringify(db.settings);
}
function stampChanges(){
  var now=Date.now(), me=meName(), changed=false;
  ["income","fixed","expenses","investments"].forEach(function(k){
    (db[k]||[]).forEach(function(i){
      var s=itemKey(i), key=k+":"+i.id;
      if(snap[key]!==s){
        i.at=now; if(!i.by&&me) i.by=me;
        snap[key]=itemKey(i); changed=true;
      }
    });
  });
  var ss=JSON.stringify(db.settings);
  if(snap.__settings!==ss){ db.settingsAt=now; snap.__settings=ss; changed=true; }
  return changed;
}
function killItem(list,id){
  var i=(db[list]||[]).find(function(x){return x.id===id;});
  if(i){ i.del=true; i.at=Date.now(); }
}
function mergeDoc(rem){
  if(!rem||typeof rem!=="object") return false;
  var changed=false;
  ["income","fixed","expenses","investments"].forEach(function(k){
    var map={};
    (db[k]||[]).forEach(function(i){ map[i.id]=i; });
    (rem[k]||[]).forEach(function(r){
      var l=map[r.id];
      if(!l){ map[r.id]=r; changed=true; }
      else if((r.at||0)>(l.at||0)){ map[r.id]=r; changed=true; }
    });
    db[k]=Object.keys(map).map(function(id){ return map[id]; });
  });
  if((rem.settingsAt||0)>(db.settingsAt||0)&&rem.settings){
    db.settings=rem.settings; db.settingsAt=rem.settingsAt; changed=true;
  }
  return changed;
}
function clean(v){ return String(v||"").replace(/[\s\u200B-\u200D\uFEFF]/g,""); }
function rpc(fn,body){
  var c=syncCfg();
  var key=clean(c.key), url=clean(c.url).replace(/\/+$/,"");
  if(!/^https:\/\/[a-z0-9-]+\.supabase\.(co|in)$/i.test(url)) return Promise.reject(new Error("URL:en ser fel ut: "+url));
  if(key.length<20) return Promise.reject(new Error("Nyckeln ser för kort ut"));
  return fetch(url+"/rest/v1/rpc/"+fn,{
    method:"POST",
    headers:{"content-type":"application/json","apikey":key,"authorization":"Bearer "+key},
    body:JSON.stringify(body)
  }).then(function(r){
    if(!r.ok) return r.text().then(function(t){ throw new Error(r.status+": "+t.slice(0,120)); });
    return r.json();
  });
}
function payload(){
  return {income:db.income,fixed:db.fixed,expenses:db.expenses,investments:db.investments,
    settings:db.settings,settingsAt:db.settingsAt||0};
}
function syncNow(silent){
  var c=syncCfg();
  if(!c||!c.url||!c.key||!c.hid||syncState.busy) return;
  syncState.busy=true; syncState.err=null; if(!silent) render();
  rpc("hh_load",{p_hid:c.hid}).then(function(res){
    var row=Array.isArray(res)?res[0]:res;
    var rem=row&&row.data?row.data:null;
    var pulled=mergeDoc(rem);
    if(pulled){ rebuildSnap(); try{ localStorage.setItem(KEY,JSON.stringify(db)); }catch(e){} }
    var mine=JSON.stringify(payload());
    var same=rem&&JSON.stringify({income:rem.income||[],fixed:rem.fixed||[],expenses:rem.expenses||[],
      investments:rem.investments||[],settings:rem.settings||{},settingsAt:rem.settingsAt||0})===mine;
    if(same){ syncState.busy=false; syncState.t=Date.now(); render(); return; }
    return rpc("hh_save",{p_hid:c.hid,p_data:payload()}).then(function(){
      syncState.busy=false; syncState.t=Date.now(); render();
    });
  }).catch(function(e){
    syncState.busy=false;
    syncState.err=/Failed to fetch|NetworkError|Load failed/.test(e.message)
      ?"Ingen kontakt med servern – kontrollera URL och nyckel":e.message;
    render();
  });
}
function scheduleSync(){
  if(!syncCfg()) return;
  clearTimeout(syncTimer);
  syncTimer=setTimeout(function(){ syncNow(true); },1500);
}
function syncStatus(){
  if(syncState.err) return '<span class="sync bad">Synk: '+esc(syncState.err)+'</span>';
  if(syncState.busy) return '<span class="sync">Synkar…</span>';
  if(syncState.t) return '<span class="sync ok">Synkad '+new Date(syncState.t).toLocaleTimeString("sv-SE",{hour:"2-digit",minute:"2-digit"})+'</span>';
  return '<span class="sync">Inte synkad än</span>';
}
function newHid(){
  if(window.crypto&&crypto.randomUUID) return crypto.randomUUID();
  return "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g,function(c){
    var r=Math.random()*16|0; return (c==="x"?r:(r&0x3|0x8)).toString(16);
  });
}
function inviteLink(){
  var c=syncCfg()||{};
  var d=btoa(unescape(encodeURIComponent(JSON.stringify({url:c.url,key:c.key,hid:c.hid}))));
  return location.origin+location.pathname+"?setup="+encodeURIComponent(d);
}
function readSetupParam(){
  var m=location.search.match(/[?&]setup=([^&]+)/);
  if(!m) return;
  try{
    var d=JSON.parse(decodeURIComponent(escape(atob(decodeURIComponent(m[1])))));
    var c=syncCfg()||{};
    if(d.url&&d.key&&d.hid){
      c.url=d.url; c.key=d.key; c.hid=d.hid; setSyncCfg(c);
      history.replaceState(null,"",location.pathname);
    }
  }catch(e){}
}

var RISKOFTYPE={"Räntor":"lag","Fonder":"medel","ETF":"medel","Aktier":"hog","Krypto":"hog","Övrigt":"medel"};
var coachQ=null, projAmt=null;

function cfg(){ return PROFILES[db.settings.riskProfile]||PROFILES["Balanserad"]; }
function allContribs(){
  var s=0; L("investments").forEach(function(i){ (i.contribs||[]).forEach(function(c){ s+=c.amount; }); });
  return s;
}
function coachData(){
  var inc=sumIncome(), fix=sumFixed(), vr=sumVar(view), sav=inc-fix-vr;
  var ms=activeMonths().slice(-3);
  var avgVar=ms.length?ms.reduce(function(a,m){return a+sumVar(m);},0)/ms.length:vr;
  var mCost=fix+avgVar;
  var cash=db.settings.cashOverride>0?db.settings.cashOverride:Math.max(0,totalSaved()-allContribs());
  var p=cfg(), target=p.buf*mCost;
  return {inc:inc,fix:fix,vr:vr,sav:sav,invM:investedIn(view),over:Math.max(0,sav-investedIn(view)),
    mCost:mCost,cash:cash,target:target,p:p,inv:invTotals()};
}
function allocate(d){
  var over=d.over, toBuf=0;
  if(d.cash<d.target){
    var missing=d.target-d.cash;
    toBuf=Math.min(over, d.cash<d.target*0.5?missing:Math.min(over*0.5,missing));
  }
  var inv=over-toBuf, rows=[];
  if(toBuf>0) rows.push({k:"buffert",amt:toBuf,
    why:"Din buffert täcker "+(d.mCost>0?(d.cash/d.mCost).toFixed(1):"0")+" månaders utgifter av "+d.p.buf+" som din profil bygger på. Bufferten går före investeringar – utan den blir börsen din nödkassa."});
  var w=d.p.w, keys=["index","ranta","tillvaxt","hog"], sum=0;
  keys.forEach(function(k){
    if(!w[k]||inv<=0) return;
    var a=Math.round(inv*w[k]/100/50)*50; sum+=a;
    if(a>0) rows.push({k:k,amt:a,why:null});
  });
  var diff=Math.round(inv)-sum;
  if(diff!==0){ var r=rows.find(function(x){return x.k==="index";})||rows[rows.length-1]; if(r) r.amt+=diff; }
  return rows.filter(function(r){return r.amt>0;});
}
function riskMix(){
  var t={lag:0,medel:0,hog:0}, tot=0;
  L("investments").forEach(function(i){ var b=RISKOFTYPE[i.type]||"medel"; t[b]+=i.value; tot+=i.value; });
  return {t:t,tot:tot};
}
function fv(start,monthly,years,rate){
  var r=rate/100/12, n=years*12;
  return start*Math.pow(1+r,n)+(r>0?monthly*((Math.pow(1+r,n)-1)/r):monthly*n);
}

        '<span class="lbl">'+b.n+'<small>'+share+' % av överskottet</small></span>'+
        '<span class="num" style="font-weight:600">'+kr(r.amt)+'</span></summary>'+
        '<div class="blkbody"><p><b>Vad det är.</b> '+b.vad+'</p>'+
        '<p><b>Varför just nu.</b> '+(r.why||whyBlock(r.k,d))+'</p>'+
        '<ul class="kv"><li><span>Risknivå</span><b>'+b.risk+'</b></li>'+
        '<li><span>Tidshorisont</span><b>'+b.hor+'</b></li>'+

        '<p class="plus"><b>Fördelar</b><br>'+b.plus.join("<br>")+'</p>'+
        '<p class="minus"><b>Nackdelar</b><br>'+b.minus.join("<br>")+'</p></div></details>';
    });
  }
  h+='</div>';

  // analys

  // frågor
  var QS=["Vad ska jag investera i denna månad?","Har jag för mycket i en investering?",
    "Hur ser min riskspridning ut?","Vad krävs för att nå sparmålet snabbare?","Hur utvecklas det på 5 år?"];
  h+='<div class="card"><h2>Fråga coachen</h2><div class="chips">';

  return h;
}
function whyBlock(k,d){
  var p=d.p;
  if(k==="index") return "Basen i sparandet. Med "+(db.settings.horizonYears||10)+" års horisont hinner breda börssvängningar jämna ut sig, och du behöver inte välja rätt bolag för att det ska fungera.";
  if(k==="ranta") return "Profilen "+db.settings.riskProfile+" bygger på att en del av kapitalet står stilla. Den delen är din stötdämpare när börsen faller.";
  if(k==="tillvaxt") return "Ett tillägg ovanpå indexfonden för att öka den förväntade avkastningen. Andelen hålls medvetet liten eftersom den svänger mer.";
  if(k==="hog") return "Din profil ger utrymme för en liten experimentdel. Den är avsiktligt begränsad så att ett misstag inte påverkar helheten.";
  return "";
}
function analysis(d){
  var out=[], inv=d.inv, mix=riskMix();
  // buffert
  var mnd=d.mCost>0?d.cash/d.mCost:0;
  out.push(row(mnd>=d.p.buf?"ok":mnd>=d.p.buf/2?"mid":"bad","Buffert",
    kr(d.cash)+" ≈ "+mnd.toFixed(1)+" månaders utgifter (mål "+d.p.buf+")"));
  // spargrad
  var sr=d.inc>0?d.sav/d.inc*100:0;
  out.push(row(sr>=20?"ok":sr>=10?"mid":"bad","Spargrad",pct(sr)+" av inkomsten denna månad"));
  // koncentration
  if(inv.value>0){
    var worst=null;
    L("investments").forEach(function(i){ var s=i.value/inv.value*100; if(!worst||s>worst.s) worst={n:i.name,s:s}; });
    out.push(row(worst.s>40?"bad":worst.s>25?"mid":"ok","Största innehav",
      esc(worst.n)+" är "+pct(worst.s)+" av portföljen"));
    var hogAndel=mix.tot>0?mix.t.hog/mix.tot*100:0;
    var mal=d.p.w.tillvaxt+d.p.w.hog;
    out.push(row(hogAndel>mal+20?"bad":hogAndel>mal+10?"mid":"ok","Högriskandel",
      pct(hogAndel)+" i aktier/krypto mot ca "+mal+" % som profilen bygger på"));
  }else{
    out.push(row("mid","Portfölj","Inga innehav inlagda än – lägg in dem under fliken Invest"));
  }
  // mål
  if(db.settings.monthlyGoal>0){
    var diff=d.sav-db.settings.monthlyGoal;
    out.push(row(diff>=0?"ok":"mid","Sparmål",
      diff>=0?"Du ligger "+kr(diff)+" över målet":"Det fattas "+kr(-diff)+" till månadsmålet"));
  }
  return '<ul class="status">'+out.join("")+'</ul>';
}
function row(s,k,v){
  return '<li class="'+s+'"><span class="pip"></span><span class="who"><b>'+k+'</b><small>'+v+'</small></span></li>';
}
function answerQ(i,d,rows){
  var p=d.p, inv=d.inv;
  if(i===0){
    if(d.over<=0) return "<p>Du har inget överskott registrerat den här månaden, så det finns inget att fördela. Lägg in inkomst och utgifter först – eller vänta tills månaden har fler poster.</p>";
    return "<p>Förslaget står överst på sidan: "+rows.map(function(r){return kr(r.amt)+" till "+BLOCKS[r.k].n.toLowerCase();}).join(", ")+
      ". Ordningen är medveten – bufferten först, sedan bredden, sist det som svänger mest. Tryck på varje rad för att se varför.</p>";
  }
  if(i===1){
    if(inv.value<=0) return "<p>Du har inga innehav inlagda, så det går inte att bedöma än.</p>";
    var list=L("investments").map(function(x){return {n:x.name,s:x.value/inv.value*100};}).sort(function(a,b){return b.s-a.s;});
    var t=list[0];
    return "<p>"+(t.s>40
      ? "Ja – "+esc(t.n)+" står för "+pct(t.s)+" av portföljen. Över ungefär 40 % i ett innehav betyder att din utveckling i praktiken avgörs av den enda posten. Ett vanligt sätt att rätta till det utan att sälja är att lägga nya insättningar i de övriga delarna tills andelen sjunker."
      : t.s>25
      ? esc(t.n)+" är "+pct(t.s)+" av portföljen. Det är högt men inte extremt. Håll ett öga på det och styr nya köp åt andra håll."
      : "Nej. Största innehavet är "+esc(t.n)+" med "+pct(t.s)+", vilket är en rimlig nivå.")+"</p>"+
      "<ul class='kv'>"+list.slice(0,6).map(function(x){return "<li><span>"+esc(x.n)+"</span><b>"+pct(x.s)+"</b></li>";}).join("")+"</ul>";
  }
  if(i===2){
    var m=riskMix();
    if(m.tot<=0) return "<p>Lägg in dina innehav under fliken Invest så räknar jag ut spridningen.</p>";
    var l=m.t.lag/m.tot*100,me=m.t.medel/m.tot*100,hg=m.t.hog/m.tot*100;
    return "<p>Så här ligger portföljen fördelad på risknivå, baserat på vilken typ du valt för varje innehav:</p>"+
      "<ul class='kv'><li><span>Låg risk (räntor)</span><b>"+pct(l)+"</b></li>"+
      "<li><span>Medel (fonder, ETF)</span><b>"+pct(me)+"</b></li>"+
      "<li><span>Hög (aktier, krypto)</span><b>"+pct(hg)+"</b></li></ul>"+
      "<p>Profilen "+db.settings.riskProfile+" bygger på ungefär "+(p.w.tillvaxt+p.w.hog)+" % i den högre änden. "+
      (hg>p.w.tillvaxt+p.w.hog+10?"Du ligger över det – nya pengar kan gå till den breda delen tills det jämnar ut sig.":
       hg<Math.max(0,p.w.tillvaxt+p.w.hog-15)?"Du ligger under det – det är inget fel, men du tar mindre risk än profilen antyder.":
       "Du ligger nära den nivån.")+"</p>";
  }
  if(i===3){
    var g=db.settings.monthlyGoal, need=g-d.sav;
    var byCat={}; expOf(view).forEach(function(e){ byCat[e.cat]=(byCat[e.cat]||0)+e.amount; });
    var top=Object.keys(byCat).sort(function(a,b){return byCat[b]-byCat[a];}).slice(0,3);
    var s="<p>";
    if(g<=0) s+="Sätt först ett månadsmål under fliken Sparande.";
    else if(need<=0) s+="Du klarar redan målet med "+kr(-need)+" marginal. Vill du snabba upp det ytterligare är höjt månadsmål det enklaste greppet.";
    else s+="Det fattas "+kr(need)+" per månad. Tre vägar dit: sänk en rörlig kategori, kapa en fast kostnad, eller öka inkomsten.";
    s+="</p>";
    if(top.length) s+="<p>Dina största rörliga poster denna månad:</p><ul class='kv'>"+
      top.map(function(c){return "<li><span>"+c+"</span><b>"+kr(byCat[c])+"</b></li>";}).join("")+"</ul>"+
      "<p class='hint'>En sänkning på 20 % av "+top[0]+" ger "+kr(byCat[top[0]]*0.2)+" i månaden.</p>";
    if(sumFixed()>0) s+="<p>Dina fasta utgifter är "+kr(sumFixed())+" per månad. De ger oftast mest per nedlagd timme att förhandla om, eftersom effekten kommer varje månad utan att du behöver tänka på den igen.</p>";
    return s;
  }
  if(i===4){
    var m=projAmt!==null?projAmt:Math.round((d.over||0)/100)*100;
    var start=inv.value, r=p.ret;
    var s='<div class="field"><label>Investerar per månad</label><input type="number" inputmode="numeric" id="projIn" value="'+m+'"></div>'+
      '<button class="btn ghost sm" id="projGo" style="margin-bottom:12px">Räkna om</button>';
    s+="<p>Utgår från "+kr(start)+" idag och "+kr(m)+" i månaden. Avkastningen är ett antagande, inte ett löfte – tre scenarier:</p><ul class='kv'>";
    [[Math.max(0,r-3),"Svag utveckling"],[r,"Förväntat ("+r+" %)"],[r+3,"Stark utveckling"]].forEach(function(x){
      s+="<li><span>"+x[1]+"</span><b>"+kr(fv(start,m,5,x[0]))+"</b></li>";
    });
    s+="</ul><p class='hint'>Insatt kapital under perioden: "+kr(start+m*60)+". Skillnaden mot beloppen ovan är ränta-på-ränta – och den skillnaden växer kraftigt efter år 10.</p>";
    return s;
  }
  return "";
}

    return h;
  }
  h+='<div class="chat">';
  if(!chat.length) h+='<p class="hint" style="margin:0 0 12px">Coachen ser hela din ekonomi: inkomst, utgifter per kategori, buffert, mål, portfölj och profil. Fråga vad du vill.</p>';
  chat.forEach(function(m){
    h+='<div class="msg '+m.role+'"><p>'+mdlite(m.content)+'</p></div>';
  });
  if(aiBusy) h+='<div class="msg assistant thinking"><p>Räknar på dina siffror…</p></div>';
  if(aiErr) h+='<div class="msg err"><p>'+esc(aiErr)+'</p></div>';
  h+='</div>';
  h+='<div class="field" style="margin-top:12px"><textarea id="ain" rows="2" placeholder="Vad tycker du att jag ska göra med överskottet?"></textarea></div>'+
    '<button class="btn" id="asend"'+(aiBusy?" disabled":"")+'>Skicka</button>'+
    '<div style="display:flex;gap:8px;margin-top:8px">'+
    '<button class="btn ghost sm" id="aclear">Rensa samtal</button>'+
    '<button class="btn ghost sm" id="akeyEdit">Nyckel</button></div>';
  return h+'</div>';
}

function askAI(text){
  if(!text.trim()||aiBusy) return;
  aiErr=null; chat.push({role:"user",content:text.trim()}); aiBusy=true; saveChat(); render();
  var msgs=chat.slice(-12).map(function(m){return {role:m.role,content:m.content};});
  fetch("https://api.anthropic.com/v1/messages",{
    method:"POST",
    headers:{"content-type":"application/json","x-api-key":getKey(),
      "anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
    body:JSON.stringify({model:db.settings.aiModel||"claude-sonnet-5",max_tokens:1200,
      system:AISYS+"\n\nANVÄNDARENS EKONOMI JUST NU:\n"+aiContext(),messages:msgs})
  }).then(function(r){ return r.json().then(function(j){ return {ok:r.ok,status:r.status,j:j}; }); })
  .then(function(res){
    aiBusy=false;
    if(!res.ok){
      var m=res.j&&res.j.error?res.j.error.message:"Okänt fel";
      aiErr=res.status===401?"Nyckeln godtogs inte. Kontrollera att den är rätt kopierad.":
            res.status===429?"För många anrop just nu. Vänta en stund.":
            res.status===400&&/credit|balance/i.test(m)?"Kontot saknar saldo. Fyll på i Anthropic Console.":
            "Fel "+res.status+": "+m;
      render(); return;
    }
    var txt=(res.j.content||[]).filter(function(b){return b.type==="text";}).map(function(b){return b.text;}).join("\n").trim();
    chat.push({role:"assistant",content:txt||"(tomt svar)"}); saveChat(); render();
    setTimeout(function(){
      var ms=document.querySelectorAll(".msg"); if(ms.length) ms[ms.length-1].scrollIntoView({block:"center",behavior:"smooth"});
    },60);
  })
  .catch(function(){
    aiBusy=false;
    aiErr="Kunde inte nå API:et. Kontrollera internet – om felet återkommer behöver vi en liten mellanserver.";
    render();
  });
}

/* ---------- händelser ---------- */
function on(sel,ev,fn){ var e=document.getElementById(sel); if(e) e.addEventListener(ev,fn); }

function wire(){
  document.querySelectorAll("[data-go]").forEach(function(b){
    b.onclick=function(){ setTab(b.getAttribute("data-go")); };
  });
  // utgifter
  on("qadd","click",addQuick);
  on("qa","keydown",function(e){ if(e.key==="Enter"){ e.preventDefault(); addQuick(); } });
  document.querySelectorAll("[data-del]").forEach(function(b){
    b.onclick=function(){
      killItem("expenses",b.getAttribute("data-del"));
      save(); render(); toast("Borttagen");
    };
  });
  document.querySelectorAll("[data-cat]").forEach(function(s){
    s.onchange=function(){
      var e=db.expenses.find(function(x){return x.id===s.getAttribute("data-cat");});
      if(e){ e.cat=s.value; save(); render(); }
    };
  });
  // fasta
  on("addIncome","click",function(){
    var n=document.getElementById("inName").value.trim()||"Inkomst";
    var a=num(document.getElementById("inAmt").value);
    if(!a) return toast("Skriv ett belopp");
    db.income.push({id:uid(),name:n,amount:a}); save(); render();
  });
  on("addFixed","click",function(){
    var n=document.getElementById("fxName").value.trim()||"Fast utgift";
    var a=num(document.getElementById("fxAmt").value);
    if(!a) return toast("Skriv ett belopp");
    db.fixed.push({id:uid(),name:n,amount:a}); save(); render();
  });
  document.querySelectorAll("[data-rm]").forEach(function(b){
    b.onclick=function(){
      var p=b.getAttribute("data-rm").split(":");
      killItem(p[0],p[1]);
      save(); render();
    };
  });
  // mål
  on("saveGoals","click",function(){
    db.settings.monthlyGoal=num(document.getElementById("gM").value);
    db.settings.totalGoal=num(document.getElementById("gT").value);
    db.settings.startSavings=num(document.getElementById("gS").value);
    var gd=document.getElementById("gD"); if(gd) db.settings.targetDate=gd.value;
    save(); render(); toast("Målen sparade");
  });
  // invest
  on("addInv","click",function(){
    var n=document.getElementById("ivName").value.trim();
    if(!n) return toast("Ge innehavet ett namn");
    var inv=num(document.getElementById("ivInv").value);
    db.investments.push({id:uid(),name:n,type:document.getElementById("ivType").value,
      invested:inv,value:num(document.getElementById("ivVal").value)||inv,
      contribs:inv?[{date:todayISO(),amount:inv}]:[]});
    save(); render(); toast("Innehav tillagt");
  });
  document.querySelectorAll("[data-inv]").forEach(function(inp){
    inp.onchange=function(){
      var i=db.investments.find(function(x){return x.id===inp.getAttribute("data-inv");});
      if(!i) return;
      var f=inp.getAttribute("data-f"), v=num(inp.value);
      if(f==="invested" && v>i.invested){
        i.contribs=i.contribs||[]; i.contribs.push({date:todayISO(),amount:v-i.invested});
      }
      i[f]=v; save(); render();
    };
  });
  document.querySelectorAll("[data-rminv]").forEach(function(b){
    b.onclick=function(){
      killItem("investments",b.getAttribute("data-rminv"));
      save(); render();
    };
  });
  // hushåll
  on("syNew","click",function(){ document.getElementById("syHid").value=newHid(); });
  on("sySave","click",function(){
    var c=syncCfg()||{};
    c.me=document.getElementById("syMe").value.trim();
    c.url=clean(document.getElementById("syUrl").value);
    c.key=clean(document.getElementById("syKey").value);
    c.hid=clean(document.getElementById("syHid").value);
    setSyncCfg(c); syncState.err=null; render();
    if(c.url&&c.key&&c.hid) syncNow(); else toast("Sparat");
  });
  on("syNow","click",function(){ syncNow(); });
  on("syInvite","click",function(){
    var t=inviteLink();
    if(navigator.share) navigator.share({title:"Ekonomi",url:t}).catch(function(){});
    else if(navigator.clipboard) navigator.clipboard.writeText(t).then(function(){ toast("Länk kopierad"); });
    else prompt("Kopiera länken",t);
  });
  // ai
  on("akeySave","click",function(){
    var k=document.getElementById("akey").value.trim();
    db.settings.aiModel=document.getElementById("amodel").value; save();
    try{
      if(k) localStorage.setItem(AIKEY,k); else localStorage.removeItem(AIKEY);
    }catch(e){}
    showKey=false; render(); toast(k?"Nyckeln sparad":"Nyckeln borttagen");
  });
  on("akeyDel","click",function(){
    try{ localStorage.removeItem(AIKEY); }catch(e){}
    showKey=false; render(); toast("Nyckeln borttagen");
  });
  on("akeyEdit","click",function(){ showKey=true; render(); });
  on("asend","click",function(){
    var t=document.getElementById("ain"); if(t){ askAI(t.value); }
  });
  on("aclear","click",function(){ chat=[]; aiErr=null; saveChat(); render(); });
  // coach
  document.querySelectorAll("[data-prof]").forEach(function(b){
    b.onclick=function(){ db.settings.riskProfile=b.getAttribute("data-prof"); save(); render(); };
  });
  on("saveProf","click",function(){
    db.settings.horizonYears=num(document.getElementById("hz").value)||10;
    db.settings.cashOverride=num(document.getElementById("cashO").value);
    save(); render(); toast("Profilen sparad");
  });
  document.querySelectorAll("[data-q]").forEach(function(b){
    b.onclick=function(){
      var i=+b.getAttribute("data-q");
      coachQ=(coachQ===i)?null:i; render();
      if(coachQ!==null) setTimeout(function(){
        var a=document.querySelector(".answer"); if(a) a.scrollIntoView({block:"center",behavior:"smooth"});
      },40);
    };
  });
  on("projGo","click",function(){ projAmt=num(document.getElementById("projIn").value); render(); });
  // backup
  on("exp","click",function(){
    var data=JSON.stringify(db,null,2);
    var ta=document.getElementById("expOut");
    try{
      var blob=new Blob([data],{type:"application/json"});
      var a=document.createElement("a");
      a.href=URL.createObjectURL(blob); a.download="ekonomi-backup.json"; a.click();
      setTimeout(function(){URL.revokeObjectURL(a.href);},1000);
      toast("Filen laddas ner");
    }catch(e){}
    ta.style.display="block"; ta.value=data; toast("Kopiera texten och spara den");
  });
  on("impBtn","click",function(){ document.getElementById("imp").click(); });
  on("imp","change",function(e){
    var f=e.target.files[0]; if(!f) return;
    var r=new FileReader();
    r.onload=function(){
      try{
        var d=JSON.parse(r.result);
        if(!d.expenses) throw 0;
        db=d; save(); render(); toast("Data importerad");
      }catch(err){ toast("Filen kunde inte läsas"); }
    };
    r.readAsText(f);
  });
}

function addQuick(){
  var inp=document.getElementById("qa");
  var p=parseExpense(inp.value);
  if(!p) return toast("Skriv t.ex. ICA 650");
  var d=document.getElementById("qd").value||todayISO();
  db.expenses.push({id:uid(),date:d,name:p.name,amount:p.amount,cat:p.cat});
  save();
  var m=mKey(d); if(m!==view) view=m;
  render();
  toast(p.name+" · "+kr(p.amount)+" · "+p.cat);
  setTimeout(function(){ var q=document.getElementById("qa"); if(q){ q.value=""; q.focus(); } },10);
}

function setTab(t){
  tab=t;
  document.querySelectorAll("nav button").forEach(function(b){
    if(b.getAttribute("data-tab")===t) b.setAttribute("aria-current","page");
    else b.removeAttribute("aria-current");
  });
  render();
}
document.querySelectorAll("nav button").forEach(function(b){
  b.addEventListener("click",function(){ setTab(b.getAttribute("data-tab")); });
});
readSetupParam();
rebuildSnap();
document.addEventListener("visibilitychange",function(){ if(!document.hidden) syncNow(true); });
setInterval(function(){ if(!document.hidden) syncNow(true); },20000);
setTimeout(function(){ syncNow(true); },300);
document.getElementById("prevM").addEventListener("click",function(){ view=shiftMonth(view,-1); render(); });
document.getElementById("nextM").addEventListener("click",function(){ view=shiftMonth(view,1); render(); });

render();
